gui:
  scrollHeight: 2
  scrollPastBottom: true
  mouseEvents: false
  ignoreMouseEvents: false
  expandSidePanels: false
  screenMode: "normal"
  border: "single"
  theme:
    activeBorderColor:
      - "green"
      - "bold"
    inactiveBorderColor:
      - "default"
    optionsTextColor:
      - "blue"
    selectedLineBgColor:
      - "blue"
    selectedRangeBgColor:
      - "blue"
    cherryPickedCommitBgColor:
      - "cyan"
    cherryPickedCommitFgColor:
      - "blue"
    unstagedChangesColor:
      - "red"
    defaultFgColor:
      - "default"
  commitLength:
    show: true
  skipUnstageLineWarning: false
  skipStashWarning: false
  showListFooter: true
  showFileTree: true
  showRandomTip: true
  showIcons: false
  showBranchCommitHash: false
  showBottomLine: true
  showCommandLog: true
  showPanelJumps: true
  nerdFontsVersion: ""
  commandLogSize: 8
  splitDiff: "auto"
  windowSize: "normal"
  borderColor: ["default"]
  animateExplosion: true
  portraitMode: "auto"
  filterMode: "substring"
  spinner:
    frames:
      - "|"
      - "/"
      - "-"
      - "\\"
    rate: 50
  statusPanelView: "dashboard"
  switchTabsWithPanelJumpKeys: false
  switchPanelComponentsWithPanelJumpKeys: false
  returnToRunningTab: "subProcess"
  wrapLinesInStagingView: true
  useHunksWithoutStash: false
  sidePanelWidth: 0.3333
  mainPanelSplitMode: "flexible"
  enlargedSideViewLocation: "left"
  disableStartupPopups: false
  notARepository: "prompt"
  promptToReturnFromSubprocess: true
  displayPatch: true
  fullScreen: false
  mainViewMode: "patch"
  themeConfig:
    border:
      single: ─
      double: ═
  commitPrefixes:
    pattern: ""
    replace: ""
  preset: ""
  os:
    openCommand: "open {{filename}}"
    openLinkCommand: "open {{link}}"
  disableColor: false
  donationPromptWidgetCount: 2

update:
  method: prompt
  days: 14

confirmOnQuit: false

os:
  openCommand: open {{filename}}
  openLinkCommand: open {{link}}

disableStartupPopups: false

notARepository: skip

promptToReturnFromSubprocess: false

keybinding:
  universal:
    quit: q
    quit-alt1: <c-c>
    return: <esc>
    quitWithoutChangingDirectory: Q
    togglePanel: <tab>
    prevItem: <up>
    nextItem: <down>
    prevItem-alt: k
    nextItem-alt: j
    prevPage: <left>
    nextPage: <right>
    scrollLeft: H
    scrollRight: L
    gotoTop: <home>
    gotoBottom: <end>
    toggleRangeSelect: v
    rangeSelectDown: <s-down>
    rangeSelectUp: <s-up>
    prevBlock: <s-left>
    nextBlock: <s-right>
    prevBlock-alt: <backtab>
    nextBlock-alt: <tab>
    jumpToBlock: ["1", "2", "3", "4", "5"]
    nextMatch: n
    prevMatch: N
    startSearch: /
    optionMenu: <disabled>
    optionMenu-alt1: "?"
    select: <space>
    goInto: <enter>
    openRecentRepos: <c-r>
    confirm: <enter>
    confirmInEditor: <a-enter>
    remove: d
    reset: g
    copyToClipboard: <c-o>
    openIntegrationPanel: <c-i>
    moveUpCommit: <c-k>
    moveDownCommit: <c-j>
    searchContext: <disabled>
    searchContextConfirm: <disabled>
    extrasMenu: "@"
    toggleWhitespaceInDiffView: <c-w>
    increaseContextInDiffView: "}"
    decreaseContextInDiffView: "{"
    openDiffTool: <c-t>

  status:
    checkForUpdate: u
    recentRepos: <enter>
    allBranchesLogGraph: a

  files:
    commitChanges: c
    commitChangesWithoutHook: w
    amend: A
    commitChangesWithEditor: C
    findBaseCommitForFixup: <c-f>
    ignoreFile: i
    refreshFiles: r
    stashAllChanges: s
    viewStashOptions: S
    toggleStagedAll: a
    viewResetOptions: D
    fetch: f
    toggleStaged: <space>
    toggleTreeView: <c-t>
    openMergeTool: M
    openStatusFilter: <c-b>
    ignoreOrExcludeFile: I
    refreshPatchPanel: <c-r>
    moveUp: <disabled>
    moveDown: <disabled>

  branches:
    createPullRequest: o
    viewPullRequestOptions: O
    copyPullRequestURL: <c-y>
    checkoutBranchByName: c
    forceCheckoutBranch: F
    rebaseBranch: r
    renameBranch: R
    mergeIntoCurrentBranch: M
    viewGitFlowOptions: i
    fastForward: f
    createTag: T
    pushTag: P
    setUpstream: u
    fetchRemote: f
    refresh: r
    nextTab: ]
    prevTab: [
    nextBranch: <right>
    prevBranch: <left>
    nextBranch-group: <right>
    prevBranch-group: <left>
    setBranchFilter: <c-b>
    renameTag: R

  commits:
    squashDown: s
    renameCommit: r
    renameCommitWithEditor: R
    viewResetOptions: g
    markCommitAsFixup: f
    createFixupCommit: F
    squashAboveCommits: S
    moveDownCommit: <c-j>
    moveUpCommit: <c-k>
    amendToCommit: A
    pickCommit: p
    revertCommit: t
    cherryPickCopy: c
    pasteCommits: v
    markCommitAsPicked: <space>
    copyCommitAttributeToClipboard: "y"
    openLogMenu: <c-l>
    openInBrowser: o
    viewBisectOptions: b
    startInteractiveRebase: i

  amendAttribute:
    commitAuthor: a
    commitAuthorEmail: E
    commitDate: d
    resetAuthor: R

  stash:
    popStash: g
    renameStash: r

  commitFiles:
    checkoutCommitFile: c
    openFile: o

  main:
    toggleSelectHunk: a
    pickBothHunks: b
    editSelectHunk: E

  submodules:
    init: i
    update: u
    bulkMenu: b

customCommands:
  - key: "a"
    context: "files"
    description: "git add -A"
    command: "git add -A"
    stream: false
    showOutput: false
    after:
      checkForConflicts: false
      refresh: true
      refetch: false
  - key: "c"
    context: "files"
    description: "git commit"
    prompts:
      - type: "input"
        title: "Commit message"
        key: "Message"
    command: "git commit -m '{{.Form.Message}}'"
    stream: true
    showOutput: false
    after:
      checkForConflicts: false
      refresh: true
      refetch: false

