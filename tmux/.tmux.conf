unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-s

set -g mouse on

set-window-option -g mode-keys vi

# Allow copy/paste to flow through SSH to the local terminal's clipboard.
# Uses OSC 52, which tmux emits and the local terminal (Ghostty/iTerm2/etc.)
# interprets. This is what makes copy/paste work inside an SSH'd tmux session.
set -g set-clipboard on
set -ag terminal-features ",xterm-256color:clipboard,tmux-256color:clipboard"
# Bound copy in vi-mode to push selection to clipboard and exit copy mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
set -g renumber-windows on       # renumber all windows when any window is closed
set -g allow-rename off          # don't rename windows automatically
setw -g automatic-rename off     # disable automatic window renaming

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1 

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key "s" run-shell "~/.config/tmux/scripts/sesh-picker.sh"

set-option -g status-position top

# Simplified status for better performance
set -g status-style bg=default
set -g status-interval 5
set -g window-status-format "#I:#W#F"

# prevent tmux from renaming windows to hostname / command
set -g allow-rename off
setw -g automatic-rename off
setw -g automatic-rename-format '#W'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'

# Dracula theme — https://github.com/dracula/tmux
# Plugins (left → right order on the right status bar):
#   ssh-session  user@host (only shown when SSH_CONNECTION is set)
#   cwd          current working dir (~-collapsed)
#   time         day, date, time, timezone
#   battery      charge % + AC status (nerdfont icons)
#   network      eth/wifi/offline indicator
#   git          branch + dirty/clean status
#   weather      temp + forecast icon (location-based)
#   sys-temp     system temperature
set -g @dracula-plugins "ssh-session cwd git network battery time weather sys-temp"
set -g @dracula-show-powerline true
set -g @dracula-show-left-sep ""
set -g @dracula-show-right-sep "" 
set -g @dracula-show-left-icon "󰉋 #S"
set -g @dracula-show-timezone true
set -g @dracula-time-format "%a %d %b %H:%M %Z"
set -g @dracula-show-flags true
set -g @dracula-refresh-rate 5
set -g @dracula-show-empty-plugins false
# Harmonize the full status line around orange + blue/purple.
# Right side is locked (triadic muted): dark_purple workspace, cyan system,
# orange environment, red ssh alert.
# Left session block: override dracula's `green` variable to dark_purple so
# the anchor ties in with the workspace segments (cwd/git) on the right.
# The bar flows dark_purple (left) -> cyan (mid) -> orange (right), with
# yellow-on-prefix as the warm "command mode" flag.
set -g @dracula-colors " green='#ffb86c' yellow='#8be9fd' "
# Colour scheme: Triadic muted
#   dark_purple  workspace: cwd, git, session block (left)
#   cyan         system:    network, battery, sys-temp
#   orange       environment: weather, time
#   red          security:  ssh-session
set -g @dracula-ssh-session-colors "red dark_gray"
set -g @dracula-cwd-colors "dark_purple white"
set -g @dracula-git-colors "dark_purple white"
set -g @dracula-network-colors "cyan dark_gray"
set -g @dracula-battery-colors "cyan dark_gray"
set -g @dracula-sys-temp-colors "cyan dark_gray"
set -g @dracula-time-colors "orange dark_gray"
set -g @dracula-weather-colors "orange dark_gray"
# ssh-session: only render when actually connected via SSH
set -g @dracula-show-ssh-only-when-connected true
# battery: use nerdfont icons for charge/charging state
set -g @dracula-battery-label false
set -g @dracula-show-battery-status true
# cwd: keep paths readable in the status bar
set -g @dracula-cwd-max-dirs 2
set -g @dracula-cwd-max-chars 20
# weather: celsius, hide the city name
set -g @dracula-show-fahrenheit false
set -g @dracula-show-location true
set -g @dracula-weather-hide-errors true

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

