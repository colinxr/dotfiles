unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-s

set -g mouse on

set-window-option -g mode-keys vi

# Allow copy/paste to flow through SSH to the local terminal's clipboard.
# Uses OSC 52, which tmux emits and the local terminal (Ghostty/iTerm2/etc.)
# interprets. This is what makes copy/paste work inside an SSH'd tmux session.
set -g set-clipboard on
set -ag terminal-features ",xterm-256color:clipboard,tmux-256color:clipboard"
# Bound copy in vi-mode to push selection to clipboard and exit copy mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
set -g renumber-windows on       # renumber all windows when any window is closed
set -g allow-rename off          # don't rename windows automatically
setw -g automatic-rename off     # disable automatic window renaming

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1 

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key "s" run-shell "~/.config/tmux/scripts/sesh-picker.sh"

set-option -g status-position top

# Simplified status for better performance
set -g status-left ""
set -g status-right ""
set -g status-style bg=default
set -g status-interval 5
set -g window-status-format "#I:#W#F"

# prevent tmux from renaming windows to hostname / command
set -g allow-rename off
setw -g automatic-rename off
setw -g automatic-rename-format '#W'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# List of plugins (minimal for performance)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_flavour "mocha"

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag,(),}"
set -g status-right-length 50
set -g status-left-length 50
# catppuccin does NOT read @catppuccin_status_modules_* — we compose status-left
# and status-right manually with #{E:@catppuccin_status_<module>} refs AFTER
# the plugin loads (see plugins/tmux/docs/reference/status-line.md).
# Keep only segments starship doesn't already show: session (left),
# clock + ssh client-ip (right). user/host/directory/git live in the prompt.
set -g @catppuccin_session_text " #[bold]#S#[nobold]"
set -g @catppuccin_date_time_text " %H:%M"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_window_text " #W"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# Compose the status line AFTER tpm has loaded catppuccin so the
# @catppuccin_status_<module> variables exist. Per catppuccin docs, you
# reference modules with #{E:@catppuccin_status_<module>}.
# Only segments starship doesn't already show:
#   left:  session name
#   right: clock + ssh client-ip (when SSH'd)
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_date_time}"
set -agF status-right "#[fg=#{@thm_mauve}]#(test -n \"\$SSH_CONNECTION\" && printf ' ⟦%s⟧' \"\$(printf '%s' \"\$SSH_CONNECTION\" | cut -d' ' -f1)\")#[default]"

# CRITICAL: Force catppuccin to use window name (#W) instead of pane title (#T)
# These MUST come AFTER tpm loads the plugin to override Catppuccin's defaults.
# Active window shows the active pane's working-dir basename so each window
# reflects where you actually are, not just the static window name.
set -g window-status-format "#[fg=#11111b,bg=#{@thm_overlay_2}] #I #[fg=#cdd6f4,bg=#{@thm_surface_0}] #W "
set -g window-status-current-format "#[fg=#11111b,bg=#{@thm_mauve}] #I #[fg=#cdd6f4,bg=#{@thm_surface_1}] #{b:pane_current_path}#{?window_zoomed_flag, ⦿,} "

